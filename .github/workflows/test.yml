# Checks every pull request and every push to main:
#   1. shellcheck on all shell scripts
#   2. the full end-to-end test (tests/run.sh): a real install in an Ubuntu 26.04 container under systemd
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        # Every file with a shell shebang; settings in .shellcheckrc
        run: |
          grep -rlE '^#!/(usr/)?bin/(env )?(ba)?sh' scripts tests templates | sort |
            xargs docker run --rm -v "$PWD:/mnt:ro" -w /mnt koalaman/shellcheck:v0.11.0

  e2e:
    needs: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: End-to-end test (tests/run.sh)
        run: tests/run.sh
