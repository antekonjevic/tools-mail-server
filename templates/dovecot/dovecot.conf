# Dovecot configuration (Dovecot 2.4 format).
# Managed by the mailserver scripts: edit templates/dovecot/dovecot.conf in the repo and re-run
# scripts/10-install-mail.sh. This file replaces Ubuntu's default, so nothing in conf.d is loaded.

dovecot_config_version = 2.4.2
dovecot_storage_version = 2.4.2

protocols = imap lmtp
listen = *, ::

# ---- TLS: required for every login
ssl = required
ssl_server_cert_file = /etc/letsencrypt/live/${MAIL_HOSTNAME}/fullchain.pem
ssl_server_key_file = /etc/letsencrypt/live/${MAIL_HOSTNAME}/privkey.pem
ssl_min_protocol = TLSv1.2
# The shared TLS policy (scripts/lib/common.sh), server's order first
ssl_cipher_list = ${TLS_CIPHERS}
ssl_curve_list = ${TLS_GROUPS}
ssl_server_prefer_ciphers = server

# ---- Logins: full email address + password, checked against /etc/dovecot/users
auth_mechanisms = plain login
auth_allow_cleartext = no
auth_username_format = %{user | lower}

passdb passwd-file {
  passwd_file_path = /etc/dovecot/users
}

userdb static {
  fields {
    uid = vmail
    gid = vmail
    home = /var/vmail/%{user | domain}/%{user | username}
  }
}

first_valid_uid = 5000
last_valid_uid = 5000

# ---- Storage: one Maildir per mailbox, under /var/vmail/<domain>/<user>/Maildir
mail_driver = maildir
mail_path = ~/Maildir

# me+anything@domain is delivered to me@domain
recipient_delimiter = +

namespace inbox {
  inbox = yes

  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe

    # Moving a message into Junk teaches Rspamd that it is spam
    sieve_script learn-spam {
      type = before
      cause = copy
      path = /etc/dovecot/sieve/learn-spam.sieve
    }
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Archive {
    special_use = \Archive
    auto = subscribe
  }
  mailbox Reports {
    auto = subscribe
  }

  # Moving a message out of Junk teaches Rspamd that it is not spam
  imapsieve_from Junk {
    sieve_script learn-ham {
      type = before
      cause = copy
      path = /etc/dovecot/sieve/learn-ham.sieve
    }
  }
}

# ---- Listeners: IMAP only over TLS (993); plain IMAP (143) is off
service imap-login {
  inet_listener imap {
    port = 0
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}

# Postfix hands incoming mail to Dovecot here
service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0600
    user = postfix
    group = postfix
  }
}

# Postfix checks sending logins here
service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
}

# ---- Mail rules (Sieve)
protocol lmtp {
  mail_plugins {
    sieve = yes
  }
  postmaster_address = postmaster@${PRIMARY_DOMAIN}

  # Spam goes to Junk, DMARC/TLS reports go to Reports
  sieve_script filing {
    type = before
    path = /etc/dovecot/sieve/before.sieve
  }
}

protocol imap {
  mail_plugins {
    imap_sieve = yes
  }
}

sieve_plugins {
  sieve_imapsieve = yes
  sieve_extprograms = yes
}

sieve_global_extensions {
  vnd.dovecot.pipe = yes
}

sieve_pipe_bin_dir = /etc/dovecot/sieve/bin
