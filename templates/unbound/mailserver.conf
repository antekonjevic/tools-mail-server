# Local recursive DNS resolver, used by Rspamd for blocklist lookups. Local only.
# Managed by the mailserver scripts.
server:
    interface: 127.0.0.1
    interface: ::1
    port: 53
    access-control: 127.0.0.0/8 allow
    access-control: ::1/128 allow
    hide-identity: yes
    hide-version: yes
    qname-minimisation: yes
    prefetch: yes
