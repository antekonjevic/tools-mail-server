# Failed logins in Dovecot 2.4's log format, which fail2ban's stock "dovecot" filter does not match:
#   imap-login: Login aborted: Connection closed (auth failed, 1 attempts in 2 secs) (auth_failed):
#   user=<x@example.com>, method=PLAIN, rip=203.0.113.5, ...
# Managed by the mailserver scripts.
[INCLUDES]
before = common.conf

[Definition]
_daemon = dovecot
failregex = ^%(__prefix_line)s(?:imap|pop3|submission|managesieve)-login: (?:Login aborted|Disconnected): .*\(auth_failed\): user=<[^>]*>, .*rip=<HOST>
ignoreregex =

[Init]
journalmatch = _SYSTEMD_UNIT=dovecot.service
