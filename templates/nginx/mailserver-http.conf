# Port 80: Let's Encrypt challenges only; everything else is redirected to HTTPS.
# Managed by the mailserver scripts.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
