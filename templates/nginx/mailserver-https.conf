# Port 443: serves only the MTA-STS policy and Thunderbird's automatic setup file.
# Everything else returns 404. Managed by the mailserver scripts.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/${MAIL_HOSTNAME}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${MAIL_HOSTNAME}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # The shared TLS policy (scripts/lib/common.sh), server's order first
    ssl_ciphers ${TLS_CIPHERS};
    ssl_ecdh_curve ${TLS_GROUPS};
    ssl_prefer_server_ciphers on;
    server_tokens off;

    root /var/www/mail;

    location = /.well-known/mta-sts.txt {
        default_type text/plain;
    }

    # One file per domain, picked by the name asked for: autoconfig.<domain>
    # (nginx refuses host names containing "/" or "..", so $host can't leave this directory)
    location = /mail/config-v1.1.xml {
        default_type application/xml;
        try_files /autoconfig/$host.xml =404;
    }

    location / {
        return 404;
    }
}
