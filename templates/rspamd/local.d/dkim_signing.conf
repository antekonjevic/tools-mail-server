# Sign mail sent by logged-in users and by this machine, using the domain in the From header.
# Keys: /var/lib/rspamd/dkim/<domain>.<selector>.key
# Selectors: /etc/rspamd/dkim_selectors.map (generated by "mailctl apply")
enabled = true;
sign_authenticated = true;
sign_local = true;
use_domain = "header";
use_esld = false;
# Sign mail from an alias on another hosted domain (login me@example.com, From sales@example.org),
# and mail whose envelope sender differs from the From header. Both are safe here because who
# may send as which address is checked before signing: the envelope sender by Postfix, and the
# From header by rspamd.local.lua, both against /etc/postfix/sender_login.
allow_username_mismatch = true;
allow_hdrfrom_mismatch = true;
try_fallback = false;
path = "/var/lib/rspamd/dkim/$domain.$selector.key";
selector_map = "/etc/rspamd/dkim_selectors.map";
