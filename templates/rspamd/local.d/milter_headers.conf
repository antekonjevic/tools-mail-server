# Headers added to received mail. X-Spam-Status is what the Sieve rule uses to file spam.
use = ["x-spam-status", "x-spam-level", "x-spamd-bar", "authentication-results"];
# None on mail that users send: an Authentication-Results header there would name the login
# (smtp.auth=...) to every recipient, also when sending from an alias.
authenticated_headers = [];
routines {
  # Remove look-alike headers a sender may have added themselves
  x-spam-status { remove = 1; }
  x-spam-level { remove = 1; }
  x-spamd-bar { remove = 1; }
}
